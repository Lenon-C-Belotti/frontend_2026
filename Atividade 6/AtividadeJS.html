<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu Pet Virtual</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                font-family: 'Arial', sans-serif;
            }

            .container {
                text-align: center;
                background: white;
                padding: 40px;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-width: 500px;
            }

            h1 {
                color: #333;
                margin-bottom: 20px;
                font-size: 28px;
            }

            .name-section {
                display: flex;
                gap: 10px;
                margin-bottom: 30px;
                align-items: center;
            }

            #petInput {
                flex: 1;
                padding: 12px 20px;
                font-size: 16px;
                border: 2px solid #667eea;
                border-radius: 25px;
                outline: none;
                transition: border-color 0.3s ease;
            }

            #petInput:focus {
                border-color: #764ba2;
                box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
            }

            #btnSetName {
                padding: 12px 25px;
                font-size: 14px;
                font-weight: bold;
                color: white;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                border-radius: 25px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            }

            #btnSetName:hover {
                transform: translateY(-2px);
                box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
            }

            .pet-name {
                color: #764ba2;
                font-size: 18px;
                margin-bottom: 20px;
                font-weight: bold;
                min-height: 25px;
            }

            #b {
                width: 200px;
                height: 200px;
                object-fit: contain;
                margin-bottom: 30px;
                filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
                transition: transform 0.3s ease;
            }

            #b:hover {
                transform: scale(1.1);
            }

            #btn {
                padding: 12px 40px;
                font-size: 16px;
                font-weight: bold;
                color: white;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                border-radius: 25px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            }

            #btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
            }

            #btn:active {
                transform: translateY(0);
            }

            .status {
                margin-top: 20px;
                font-size: 14px;
                color: #666;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>🐾 Meu Pet Virtual 🐾</h1>
            
            <div class="name-section">
                <input 
                    type="text" 
                    id="petInput" 
                    placeholder="Digite o nome do seu pet..." 
                    maxlength="20"
                />
                <button id="btnSetName">✅</button>
            </div>

            <div class="pet-name" id="petName">Esperando nome...</div>

            <img id="b" src="c_n.png" alt="Pet Virtual"/>
            <br>
            <button id="btn">🍖 Alimentar</button>
            <div class="status" id="status"></div>
        </div>

        <script src="PartJS.js"></script>
    </body>
</html>
